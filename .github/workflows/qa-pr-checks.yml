name: PR Quality Checks

on:
  pull_request:
    branches:
      - '*'

jobs:
  pr-checks:
    runs-on: ubuntu-latest
    name: Lint, Test & Build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install
        
      - name: Type check
        run: pnpm type-check
        
      - name: Lint
        run: pnpm lint
        
      - name: Format check
        run: pnpm prettier --check .
        
      - name: Run tests
        run: pnpm test:run

      - name: Build project
        run: pnpm build
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: ./dist
          retention-days: 1
          
      - name: Save PR event payload
        run: echo '${{ toJSON(github.event) }}' > event.json
        
      - name: Upload PR event payload
        uses: actions/upload-artifact@v3
        with:
          name: event-payload
          path: event.json
          retention-days: 1
