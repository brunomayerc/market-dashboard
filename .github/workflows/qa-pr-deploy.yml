name: QA PR Deployment

on:
  workflow_run:
    workflows: ["PR Checks"]
    types:
      - completed
    branches:
      - '*'

permissions:
  contents: write
  pages: write
  issues: write
  pull-requests: write

jobs:
  deploy-to-qa:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    name: Deploy to QA Environment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download build artifacts
        uses: dawidd6/action-download-artifact@v2
        with:
          workflow: PR Checks
          workflow_conclusion: success
          name: build-artifacts
          path: ./dist

      - name: Download PR event payload
        uses: actions/download-artifact@v3
        with:
          name: event-payload
          path: ./event-payload
          
      - name: Get PR number
        id: get-pr-number
        run: |
          PR_NUMBER=$(cat ./event-payload/event.json | jq -r '.pull_request.number')
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
          echo "PR number: $PR_NUMBER"

      - name: Deploy to QA for PRs
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: pr-${{ env.PR_NUMBER }}

      - name: Comment on PR with QA URL
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = ${{ env.PR_NUMBER }};
            const qaUrl = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr-${prNumber}/`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `🚀 Your changes have been deployed to QA: [View Deployment](${qaUrl})`
            });