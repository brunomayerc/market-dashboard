name: Production Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write

jobs:
  deploy-to-prod:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - name: Cleanup PR folder
        run: |
          git clone --branch=gh-pages https://github.com/${{ github.repository }} gh-pages
          cd gh-pages
          PR_FOLDER="pr-${PR_NUMBER}"
          if [ -d "$PR_FOLDER" ]; then
            rm -rf "$PR_FOLDER"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "Cleanup PR folder for PR #$PR_NUMBER"
            git push
          else
            echo "PR folder $PR_FOLDER does not exist. Skipping cleanup."
          fi
